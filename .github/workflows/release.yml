name: Build and publish release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure and build
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".Substring(1)
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Release tag must use vX.Y.Z or vX.Y.Z-prerelease format."
            }
            cmake -S . -B build -A x64 "-DBONDERIUM_VERSION=$version" -DBONDERIUM_ENABLE_UPDATES=ON
          } else {
            cmake -S . -B build -A x64 -DBONDERIUM_ENABLE_UPDATES=OFF
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/updater_integration_tests.ps1

      - name: Package application
        if: startsWith(github.ref, 'refs/tags/v') && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Bonderium-package"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item build/Release/Bonderium.exe $package
          Copy-Item install.bat, install.ps1, updater.ps1, README.md $package
          Compress-Archive -Path "$package/*" -DestinationPath Bonderium-windows-x64.zip

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v') && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Bonderium-windows-x64
          path: Bonderium-windows-x64.zip
          if-no-files-found: error

  static-analysis:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC static analysis
        run: cmake -S . -B build-analysis -A x64 -DBONDERIUM_ENABLE_CODE_ANALYSIS=ON

      - name: Build with MSVC static analysis
        run: cmake --build build-analysis --config Release

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, static-analysis]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: Bonderium-windows-x64
          path: release-package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-package/Bonderium-windows-x64.zip
          name: Bonderium ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
